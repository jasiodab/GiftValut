<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-label="Gift Vault logo">
  <!-- Vault body -->
  <rect x="2" y="6" width="28" height="22" rx="4" fill="#252329" stroke="#e2dce2" stroke-width="1"/>
  <!-- Vault door outline -->
  <rect x="5" y="9" width="22" height="16" rx="2" fill="none" stroke="#4a2335" stroke-width="1.5"/>
  <!-- Door handle / lock -->
  <circle cx="25" cy="17" r="1.2" fill="#e9afc5"/>
  <!-- Gift bow on top-left -->
  <path d="M8 10.5c0-.6-.4-1-1-1s-1 .4-1 1 .4 1 1 1 1-.4 1-1Z" fill="#e9afc5"/>
  <path d="M10 10.5c0-.6-.4-1-1-1s-1 .4-1 1 .4 1 1 1 1-.4 1-1Z" fill="#e9afc5"/>
  <path d="M9 9.8v1.4" stroke="#e9afc5" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M8.5 10.8h1" stroke="#e9afc5" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Vault shine line -->
  <rect x="4" y="8" width="2" height="20" rx="1" fill="#ffffff" opacity="0.08"/>
</svg>
